# 鈹€鈹€鈹€ Model Pool 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
# Configure one or more LLMs for the agent to use.
# id: unique identifier for referencing
# priority: lower number = higher priority (auto-assigned to missions)
model_pool:
  - id: main
    base_url: "https://www.heilovehei.com/v1"
    api_key: ""
    model: "gpt-5.5"
    thinking: false
    reasoning_effort: "xhigh"
    use_responses_api: true
    disable_response_storage: true
    priority: 1
    max_concurrent: 5

  # Example: add more models as fallbacks
  # - id: deepseek
  #   base_url: "https://api.deepseek.com"
  #   api_key: "sk-your-deepseek-key"
  #   model: "deepseek-chat"
  #   thinking: false
  #   priority: 2
  #   max_concurrent: 3

# 鈹€鈹€鈹€ Passive Observer Model 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
# A separate model for passive Observer/runtime guidance (optional).
# Falls back to the primary model if left empty.
observer:
  base_url: "https://www.heilovehei.com/v1"
  api_key: ""
  model: "gpt-5.5"
  thinking: false
  reasoning_effort: "xhigh"
  use_responses_api: true
  disable_response_storage: true

# 鈹€鈹€鈹€ Compression Model 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
# Dedicated/default model for semantic mid-round context compression.
# Empty model values fall back to the built-in default; memory compression uses this fast dedicated model path.
compression:
  base_url: ""
  api_key: ""
  model: "gpt-5.5"
  reasoning_effort: "low"
  use_responses_api: true
  disable_response_storage: true
  timeout_sec: 180

# 鈹€鈹€鈹€ Agent Defaults 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
agent_defaults:
  initial_rounds: 2
  initial_commands: 32
  command_timeout_sec: 300        # per-command sandbox timeout (seconds)
  llm_timeout_sec: 240            # LLM single response timeout (seconds)
  llm_max_retries: 10             # LLM timeout/error auto-retry count
  max_output_tokens: 10000        # approximate output token budget returned to the model
  context_compress_threshold: 320000  # mid-round compression trigger (chars)
  memory_compress_interval: 8     # structured memory compression interval (main LLM calls)
  observer_review_interval: 32    # passive Observer review interval (main LLM calls)
  knowledge_top_k: 5              # number of knowledge docs to retrieve
  knowledge_dir: "./knowledge"    # directory for knowledge zips/folders (drop .zip or dirs here)
  skills_dir: "./skills"          # directory containing */SKILL.md skill folders
  skills_auto_use: true           # allow the AI to search and activate skills during a mission
  skill_catalog_limit: 50         # max skill metadata entries injected into the system prompt
  skill_prompt_max_chars: 12000   # max SKILL.md body chars returned by activate_skill
  skill_reference_max_chars: 20000 # max chars returned by skill_read_reference
  max_rounds: 16                  # hard ceiling for mission rounds
  max_commands: 400               # hard ceiling for commands per round
  max_retries: 2                  # number of retry attempts for failed missions
  mission_timeout_sec: 0          # total mission timeout (0 = no limit)
  disable_memory_rebase: false    # skip MemoryAgent rebase on stall

  # Per-difficulty overrides (optional)
  difficulty_params:
    easy:
      initial_rounds: 2
      initial_commands: 32
      max_rounds: 6
      max_commands: 128
    medium:
      initial_rounds: 2
      initial_commands: 32
      max_rounds: 8
      max_commands: 256
    hard:
      initial_rounds: 2
      initial_commands: 32
      max_rounds: 16
      max_commands: 400

  # Multi-flag scaling 鈥?extra resources per additional flag beyond the first
  multi_flag_scaling:
    extra_rounds_per_flag: 3
    extra_commands_per_flag: 12

# 鈹€鈹€鈹€ Sandbox 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
sandbox:
  container: "pikaqiu-sandbox-1"         # Docker container name
  containers:
    - "pikaqiu-sandbox-1"
    - "pikaqiu-sandbox-2"
    - "pikaqiu-sandbox-3"
    - "pikaqiu-sandbox-4"
    - "pikaqiu-sandbox-5"
  workdir: "/tmp/pikaqiu-agent-workspace"
  public_ip: ""                      # Public IP for reverse shell listeners (optional)

# 鈹€鈹€鈹€ Web UI 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
web:
